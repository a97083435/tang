  - RULE-SET,geolocation-!cn,国外网站
  - GEOSITE,geolocation-!cn,国外网站

  # ===== 最终兜底 =====
  - MATCH,漏网之鱼

  # ========================================
  # 规则编辑简易教程
  # ========================================
  # 1. 格式：- 类型,域名,策略组，英文逗号分隔，行首两个空格
  # 2. 类型：DOMAIN（完整域名）/ DOMAIN-SUFFIX（域名后缀）/ DOMAIN-KEYWORD（关键字，易误伤）
  # 3. 策略组必须是已定义的组名，或用 DIRECT / REJECT / PASS
  # 4. MATCH 必须放最后；从上往下匹配，命中即停
  # 5. 常见错误：中文逗号、组名写错、缩进不对、规则顺序放反
  # 示例：- DOMAIN-SUFFIX,anthropic.com,人工智能
  # ========================================
