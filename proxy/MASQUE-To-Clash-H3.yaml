# 基础设置
mode: rule
allow-lan: true
mixed-port: 7890
bind-address: '*'
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: info
global-ua: clash.meta

# 外部控制面板
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# Geo配置
geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
geo-auto-update: true
geo-update-interval: 24

# 配置持久化
profile:
  store-selected: true
  store-fake-ip: true
  
# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN模式配置
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS解析
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - geosite:cn
    - rule-set:fakeip-filter
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - localhost.ptlogin2.qq.com
    - "*.msftncsi.com"
    - www.msftconnecttest.com
    - "*.ntp.org"
    - time.windows.com
    - time.apple.com
    - ntp.aliyun.com
    - cn.pool.ntp.org
    - +.market.xiaomi.com
    - +.miwifi.com
    - +.push.apple.com
    - +.pub.3gppnetwork.org
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://cloudflare-dns.com/dns-query#proxy=节点选择
      - https://dns.google/dns-query#proxy=节点选择
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# 外部资源
proxy-providers:
  VPNGATE-CHAIN:
    type: http
    url: "https://raw.githubusercontent.com/wanwushequ/VG2C/main/vpngate.yaml"
    path: "./providers/vpngate-chain.yaml"
    proxy: "端点自动"
    interval: 1800
    size-limit: 1048576
    health-check: {enable: true, url: https://cloudflare.com/cdn-cgi/trace, interval: 300, timeout: 6000, lazy: true}
