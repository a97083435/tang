  # ========================================
  # 规则编辑简易教程
  # ========================================
  #
  # 一、规则格式
  #   每条规则一行，统一格式：
  #     - 规则类型,匹配内容,策略组
  #   三部分用英文逗号分隔，前后两个空格缩进，不能用中文逗号。
  #
  # 二、三种最常用的规则类型
  #
  #   1. DOMAIN —— 匹配完整域名
  #      - DOMAIN,ai.google.dev,人工智能
  #      只匹配 ai.google.dev 这个完整域名，
  #      不匹配 www.ai.google.dev，也不匹配 ai.google.dev.cn。
  #      适合：某个具体服务、API 地址。
  #
  #   2. DOMAIN-SUFFIX —— 匹配域名后缀
  #      - DOMAIN-SUFFIX,openai.com,人工智能
  #      匹配 openai.com 以及所有子域名，
  #      如 api.openai.com、chat.openai.com。
  #      不匹配 openai.com.cn。
  #      适合：一个公司/平台的所有子域名。
  #
  #   3. DOMAIN-KEYWORD —— 匹配域名关键字
  #      - DOMAIN-KEYWORD,claude,人工智能
  #      域名里只要包含 claude 这个词就匹配，
  #      如 claude.ai、api.claude.com、myclaude.example.com。
  #      适合：不确定具体域名，但知道关键字。
  #      注意：最容易误伤，能用 DOMAIN/DOMAIN-SUFFIX 就不要用它。
  #
  # 三、策略组该写什么
  #   第三个字段必须是你配置文件里已经定义过的策略组名，例如：
  #     节点选择 / 人工智能 / 视频音频 / 社交媒体 / 电报信息
  #     谷歌服务 / 微软服务 / 苹果服务 / 加速服务 / 游戏平台
  #     国外网站 / 国内直连 / 全球拦截 / 漏网之鱼
  #   也可以直接用内置的：
  #     DIRECT —— 直连
  #     REJECT —— 拦截
  #     PASS   —— 跳过，继续匹配后面的规则
  #   如果写了不存在的组名，Clash 会报错：proxy [xxx] not found
  #
  # 四、实际例子：加一条 AI 规则
  #   想让 api.anthropic.com 走“人工智能”组：
  #   1. api.anthropic.com 是 anthropic.com 的子域名，
  #      用 DOMAIN-SUFFIX 最合适。
  #   2. 在 AI 规则区域插入：
  #        - DOMAIN-SUFFIX,anthropic.com,人工智能
  #   3. 保存，重新加载配置。
  #
  # 五、新手常犯的错误
  #   1. 用中文逗号：
  #        - DOMAIN，ai.google.dev，人工智能     ← 错
  #        - DOMAIN,ai.google.dev,人工智能       ← 对
  #   2. 策略组名写错，配置里没有这个组。
  #   3. 缩进不对，规则前必须是两个空格。
  #   4. 规则顺序放错：
  #      Clash 从上往下匹配，命中即停。
  #      MATCH 必须放最后，否则后面规则全部失效。
  #   5. DOMAIN-KEYWORD 太宽：
  #        - DOMAIN-KEYWORD,ai,人工智能
  #      会匹配所有含 ai 的域名，如 baidu.com、email.com，误伤严重。
  #
  # 六、加规则前的自检清单
  #   1. 域名对不对？先确认完整域名，别靠猜。
  #   2. 类型选对了吗？完整域名用 DOMAIN，
  #      子域名多用 DOMAIN-SUFFIX，关键字用 DOMAIN-KEYWORD。
  #   3. 策略组存在吗？去 proxy-groups: 里搜一下组名。
  #   4. 位置放对了吗？特殊规则在前，通用规则在后，MATCH 最后。
  #   5. 逗号是英文吗？缩进是两个空格吗？
  #   6. 有没有和已有规则冲突？如果前面有更宽的规则覆盖了它，
  #      新规则不会生效。
  #
  # 七、一句话总结
  #   “- 类型,域名,策略组”，英文逗号，两个空格缩进，
  #   策略组必须已存在，MATCH 放最后。
  #
  # ========================================

